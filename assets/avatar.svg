<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>
  
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Phone screen mockup area -->
  <g clip-path="url(#round)">
    
    <!-- Chat bubbles - your side, all read, no reply -->
    <!-- Bubble 1 -->
    <rect x="160" y="62" width="90" height="36" rx="16" fill="#1a4a7a"/>
    <text x="205" y="85" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#e4e6eb">hey</text>
    <!-- Read receipt 1 -->
    <g transform="translate(258,78)">
      <polyline points="0,0 3,4 9,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,0 8,4 14,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Bubble 2 -->
    <rect x="120" y="110" width="155" height="36" rx="16" fill="#1a4a7a"/>
    <text x="197" y="133" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#e4e6eb">you there?</text>
    <!-- Read receipt 2 -->
    <g transform="translate(283,126)">
      <polyline points="0,0 3,4 9,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,0 8,4 14,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Bubble 3 -->
    <rect x="80" y="158" width="230" height="36" rx="16" fill="#1a4a7a"/>
    <text x="195" y="181" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#e4e6eb">is everything okay?</text>
    <!-- Read receipt 3 -->
    <g transform="translate(318,174)">
      <polyline points="0,0 3,4 9,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,0 8,4 14,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Bubble 4 - the desperate one -->
    <rect x="210" y="206" width="65" height="36" rx="16" fill="#1a4a7a"/>
    <text x="242" y="229" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#e4e6eb">...</text>
    <!-- Read receipt 4 -->
    <g transform="translate(283,222)">
      <polyline points="0,0 3,4 9,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,0 8,4 14,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Bubble 5 - giving up -->
    <rect x="195" y="254" width="80" height="36" rx="16" fill="#1a4a7a"/>
    <text x="235" y="277" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#e4e6eb">nvm</text>
    <!-- Read receipt 5 -->
    <g transform="translate(283,270)">
      <polyline points="0,0 3,4 9,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="5,0 8,4 14,-4" fill="none" stroke="#34b7f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Big "Read 2:47 AM" at the bottom -->
    <text x="200" y="338" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#34b7f1">
      Read 2:47 AM
    </text>
    
    <!-- Subtle empty space on the left (no replies, ever) -->
    <text x="200" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6b7280" opacity="0.5">
      no reply
    </text>
    
  </g>
</svg>
