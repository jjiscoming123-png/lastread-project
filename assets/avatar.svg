<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="rgba(52,183,241,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53bdeb"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle glow behind checkmarks -->
  <ellipse cx="200" cy="190" rx="140" ry="120" fill="url(#glow)"/>

  <!-- Double checkmark - large, centered -->
  <!-- First check -->
  <polyline
    points="100,200 155,260 260,145"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Second check (offset right) -->
  <polyline
    points="150,200 205,260 310,145"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.7"
  />

  <!-- $LASTREAD text at bottom -->
  <text
    x="200" y="340"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="800"
    font-size="32"
    fill="#53bdeb"
    letter-spacing="2"
  >$LASTREAD</text>
</svg>
