<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="glow1" cx="25%" cy="50%" r="35%">
      <stop offset="0%" stop-color="rgba(52,183,241,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="50%" r="30%">
      <stop offset="0%" stop-color="rgba(33,150,243,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53bdeb"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e6eb"/>
      <stop offset="100%" stop-color="#c0c4cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#glow1)"/>
  <rect width="1500" height="500" fill="url(#glow2)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.03" stroke="#53bdeb" stroke-width="0.5">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/>
  </g>

  <!-- Left side: chat bubbles floating -->
  <!-- Bubble 1 -->
  <rect x="80" y="120" width="200" height="50" rx="20" fill="#1a4a7a" opacity="0.4"/>
  <text x="130" y="152" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8696a0" opacity="0.6">hey, you there?</text>

  <!-- Bubble 2 -->
  <rect x="120" y="190" width="160" height="50" rx="20" fill="#1a4a7a" opacity="0.3"/>
  <text x="155" y="222" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8696a0" opacity="0.5">hello??</text>

  <!-- Bubble 3 -->
  <rect x="60" y="260" width="100" height="50" rx="20" fill="#1a4a7a" opacity="0.2"/>
  <text x="85" y="292" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8696a0" opacity="0.4">...</text>

  <!-- Read receipts scattered on left bubbles -->
  <g transform="translate(240,160)" opacity="0.5">
    <polyline points="0,5 4,9 12,1" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="5,5 9,9 17,1" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(240,230)" opacity="0.4">
    <polyline points="0,5 4,9 12,1" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="5,5 9,9 17,1" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center: main title -->
  <text
    x="750" y="220"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="900"
    font-size="120"
    fill="url(#textGrad)"
    letter-spacing="-3"
  >$LASTREAD</text>

  <!-- Subtitle -->
  <text
    x="750" y="290"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="400"
    font-size="28"
    fill="#8696a0"
  >They saw it. They all saw it. Nobody replied.</text>

  <!-- Blue accent line under subtitle -->
  <rect x="700" y="310" width="100" height="2" rx="1" fill="#53bdeb" opacity="0.6"/>

  <!-- Read timestamp -->
  <g transform="translate(710,345)">
    <polyline points="0,6 5,11 14,2" fill="none" stroke="#53bdeb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="7,6 12,11 21,2" fill="none" stroke="#53bdeb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="11" font-family="monospace" font-size="14" fill="#53bdeb" opacity="0.8">Read 2:47 AM</text>
  </g>

  <!-- Right side: floating read timestamps -->
  <g opacity="0.35">
    <rect x="1150" y="130" width="220" height="36" rx="12" fill="#10131a" stroke="#1c1e24" stroke-width="1"/>
    <text x="1260" y="154" text-anchor="middle" font-family="monospace" font-size="13" fill="#53bdeb">Read Yesterday</text>
  </g>
  <g opacity="0.25">
    <rect x="1180" y="200" width="200" height="36" rx="12" fill="#10131a" stroke="#1c1e24" stroke-width="1"/>
    <text x="1280" y="224" text-anchor="middle" font-family="monospace" font-size="13" fill="#53bdeb">Read 3 weeks ago</text>
  </g>
  <g opacity="0.2">
    <rect x="1200" y="270" width="180" height="36" rx="12" fill="#10131a" stroke="#1c1e24" stroke-width="1"/>
    <text x="1290" y="294" text-anchor="middle" font-family="monospace" font-size="13" fill="#53bdeb">Read 4:18 AM</text>
  </g>
  <g opacity="0.15">
    <rect x="1170" y="340" width="210" height="36" rx="12" fill="#10131a" stroke="#1c1e24" stroke-width="1"/>
    <text x="1275" y="364" text-anchor="middle" font-family="monospace" font-size="13" fill="#53bdeb">Read Last year</text>
  </g>

  <!-- Bottom edge fade -->
  <rect x="0" y="470" width="1500" height="30" fill="url(#bg)" opacity="0.5"/>
</svg>
